[project]
name = "gg-bot"
version = "1.0.0"
description = "gg.gram Telegram bot (aiogram 3)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.22,<4",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gg_bot*"]
