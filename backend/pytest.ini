[pytest]
asyncio_mode = auto
# One event loop for the whole session: the Redis client and the SQLAlchemy
# engine are process-wide singletons and must not be shared across loops.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
